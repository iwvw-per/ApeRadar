name: Build and Test ApeRadar

run-name: Validate ${{ github.ref_name }} at ${{ github.sha }}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  CONFIGURATION: Release

jobs:
  build-test:
    name: Build and test Windows application
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\ApeRadar.sln

      - name: Build solution
        shell: pwsh
        run: dotnet build .\ApeRadar.sln --configuration $env:CONFIGURATION --no-restore

      - name: Run tests
        shell: pwsh
        run: dotnet test .\ApeRadar.sln --configuration $env:CONFIGURATION --no-build --no-restore
