name: Build and Release ApeRadar

run-name: Build ${{ inputs.release_name }} (${{ inputs.tag_name }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the build and asset names
        required: true
        default: 2.1.0
      tag_name:
        description: Git tag used by the GitHub Release
        required: true
        default: v2.1.0
      release_name:
        description: GitHub Release title
        required: true
        default: ApeRadar v2.1.0
      prerelease:
        description: Publish as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  CONFIGURATION: Release
  RUNTIME_ID: win-x64

jobs:
  build-release:
    name: Build win-x64 and publish release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\ApeRadar.sln

      - name: Run tests
        shell: pwsh
        run: dotnet test .\ApeRadar.sln --configuration $env:CONFIGURATION --no-restore

      - name: Restore Windows runtime assets
        shell: pwsh
        run: dotnet restore .\ApeRadar\ApeRadar.csproj --runtime $env:RUNTIME_ID

      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          $buildDate = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\ApeRadar-${{ inputs.version }}-$env:RUNTIME_ID"

          dotnet publish .\ApeRadar\ApeRadar.csproj `
            --configuration $env:CONFIGURATION `
            --runtime $env:RUNTIME_ID `
            --self-contained true `
            --no-restore `
            --output $publishDir `
            -p:Version=${{ inputs.version }} `
            -p:ApeRadarSoftwareVersion=${{ inputs.version }} `
            -p:ApeRadarSoftwareDate=$buildDate `
            -p:DebugType=None `
            -p:DebugSymbols=false

          if (-not (Test-Path (Join-Path $publishDir 'ApeRadar.exe'))) {
            throw 'Publish validation failed: ApeRadar.exe was not produced.'
          }
          if (-not (Test-Path (Join-Path $publishDir 'LICENSE.txt'))) {
            throw 'Publish validation failed: LICENSE.txt was not produced.'
          }

      - name: Publish framework-dependent lightweight Windows build
        shell: pwsh
        run: |
          $buildDate = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\ApeRadar-${{ inputs.version }}-$env:RUNTIME_ID-lightweight"

          dotnet publish .\ApeRadar\ApeRadar.csproj `
            --configuration $env:CONFIGURATION `
            --runtime $env:RUNTIME_ID `
            --self-contained false `
            --no-restore `
            --output $publishDir `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=${{ inputs.version }} `
            -p:ApeRadarSoftwareVersion=${{ inputs.version }} `
            -p:ApeRadarSoftwareDate=$buildDate `
            -p:DebugType=None `
            -p:DebugSymbols=false

          $requiredFiles = @(
            'ApeRadar.exe',
            'LICENSE.txt',
            'README.txt',
            'log4net.config',
            'Resources\Json\ships.json'
          )
          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path (Join-Path $publishDir $requiredFile))) {
              throw "Lightweight publish validation failed: $requiredFile was not produced."
            }
          }

      - name: Package release assets
        id: package
        shell: pwsh
        run: |
          $assetBaseName = "ApeRadar-${{ inputs.version }}-$env:RUNTIME_ID"
          $lightweightAssetBaseName = "ApeRadar-${{ inputs.version }}-$env:RUNTIME_ID-lightweight"
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\$assetBaseName"
          $lightweightPublishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\$lightweightAssetBaseName"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          $archivePath = Join-Path $releaseDir "$assetBaseName.zip"
          $checksumPath = Join-Path $releaseDir "$assetBaseName.sha256"
          $lightweightArchivePath = Join-Path $releaseDir "$lightweightAssetBaseName.zip"
          $lightweightChecksumPath = Join-Path $releaseDir "$lightweightAssetBaseName.sha256"

          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $archivePath -CompressionLevel Optimal -Force
          Compress-Archive -Path (Join-Path $lightweightPublishDir '*') -DestinationPath $lightweightArchivePath -CompressionLevel Optimal -Force

          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path $checksumPath -Value "$hash  $assetBaseName.zip" -Encoding ascii
          $lightweightHash = (Get-FileHash -Path $lightweightArchivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path $lightweightChecksumPath -Value "$lightweightHash  $lightweightAssetBaseName.zip" -Encoding ascii

          "release_dir=$releaseDir" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ApeRadar-${{ inputs.version }}-win-x64-release-assets
          path: artifacts\release\*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetBaseName = "ApeRadar-${{ inputs.version }}-$env:RUNTIME_ID"
          $lightweightAssetBaseName = "ApeRadar-${{ inputs.version }}-$env:RUNTIME_ID-lightweight"
          $releaseDir = '${{ steps.package.outputs.release_dir }}'
          $archivePath = Join-Path $releaseDir "$assetBaseName.zip"
          $checksumPath = Join-Path $releaseDir "$assetBaseName.sha256"
          $lightweightArchivePath = Join-Path $releaseDir "$lightweightAssetBaseName.zip"
          $lightweightChecksumPath = Join-Path $releaseDir "$lightweightAssetBaseName.sha256"
          $tagName = '${{ inputs.tag_name }}'
          $releaseName = '${{ inputs.release_name }}'
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'

          @"
          ## $releaseName

          ApeRadar 的 Windows x64 正式版本，提供完整自包含版和轻量版。

          ### 下载说明

          | 版本 | 文件 | 运行要求 |
          | --- | --- | --- |
          | 完整版（推荐） | ``$assetBaseName.zip`` | 已包含 .NET，无需额外安装 |
          | 轻量版 | ``$lightweightAssetBaseName.zip`` | 需要 .NET 10 Desktop Runtime x64 |

          两个压缩包都附带对应的 ``.sha256`` 校验文件。
          - 系统架构：Windows x64

          完整版已经包含 .NET 桌面运行时，解压后可直接运行 ``ApeRadar.exe``。轻量版只保留应用和必要资源，体积更小，但首次运行前必须安装 .NET 10 Desktop Runtime x64。

          ### .NET 下载

          微软官方下载：

          https://dotnet.microsoft.com/zh-cn/download/dotnet/10.0/runtime

          请在页面的“.NET 桌面运行时”栏目中选择 Windows x64 安装程序，不要选择 ASP.NET Core Runtime。

          ### 使用方法

          1. 选择一个版本并完整解压对应的 ZIP 文件。
          2. 运行目录中的 ``ApeRadar.exe``。
          3. 请勿只复制 EXE；两个版本都需要保留压缩包内的配置和资源文件。
          "@ | Set-Content -Path $notesPath -Encoding utf8

          gh release view $tagName --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tagName $archivePath $checksumPath $lightweightArchivePath $lightweightChecksumPath --clobber --repo '${{ github.repository }}'
            gh release edit $tagName --title $releaseName --notes-file $notesPath --latest --repo '${{ github.repository }}'
          }
          else {
            $arguments = @(
              'release', 'create', $tagName,
              '--repo', '${{ github.repository }}',
              '--target', '${{ github.sha }}',
              '--title', $releaseName,
              '--notes-file', $notesPath,
              '--latest',
              $archivePath,
              $checksumPath,
              $lightweightArchivePath,
              $lightweightChecksumPath
            )
            if ('${{ inputs.prerelease }}' -eq 'true') {
              $arguments += '--prerelease'
            }
            gh @arguments
          }
