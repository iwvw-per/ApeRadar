name: Build and Release ApeRadar

run-name: Build ${{ inputs.release_name }} (${{ inputs.tag_name }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in the build and asset names
        required: true
        default: 2.1.0
      tag_name:
        description: Git tag used by the GitHub Release
        required: true
        default: v2.1.0
      release_name:
        description: GitHub Release title
        required: true
        default: ApeRadar v2.1.0
      prerelease:
        description: Publish as a prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true
  CONFIGURATION: Release
  RUNTIME_ID: win-x64

jobs:
  build-release:
    name: Build win-x64 and publish release
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        shell: pwsh
        run: dotnet restore .\ApeRadar.sln

      - name: Run tests
        shell: pwsh
        run: dotnet test .\ApeRadar.sln --configuration $env:CONFIGURATION --no-restore

      - name: Restore Windows runtime assets
        shell: pwsh
        run: dotnet restore .\ApeRadar\ApeRadar.csproj --runtime $env:RUNTIME_ID

      - name: Publish self-contained Windows build
        shell: pwsh
        run: |
          $buildDate = (Get-Date).ToUniversalTime().ToString('yyyyMMdd')
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\ApeRadar-${{ inputs.version }}-$env:RUNTIME_ID"

          dotnet publish .\ApeRadar\ApeRadar.csproj `
            --configuration $env:CONFIGURATION `
            --runtime $env:RUNTIME_ID `
            --self-contained true `
            --no-restore `
            --output $publishDir `
            -p:Version=${{ inputs.version }} `
            -p:ApeRadarSoftwareVersion=${{ inputs.version }} `
            -p:ApeRadarSoftwareDate=$buildDate `
            -p:DebugType=None `
            -p:DebugSymbols=false

          if (-not (Test-Path (Join-Path $publishDir 'ApeRadar.exe'))) {
            throw 'Publish validation failed: ApeRadar.exe was not produced.'
          }
          if (-not (Test-Path (Join-Path $publishDir 'LICENSE.txt'))) {
            throw 'Publish validation failed: LICENSE.txt was not produced.'
          }

      - name: Package release assets
        id: package
        shell: pwsh
        run: |
          $assetBaseName = "ApeRadar-${{ inputs.version }}-$env:RUNTIME_ID"
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\publish\$assetBaseName"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\release'
          $archivePath = Join-Path $releaseDir "$assetBaseName.zip"
          $checksumPath = Join-Path $releaseDir "$assetBaseName.sha256"

          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $archivePath -CompressionLevel Optimal -Force

          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path $checksumPath -Value "$hash  $assetBaseName.zip" -Encoding ascii

          "asset_base_name=$assetBaseName" >> $env:GITHUB_OUTPUT
          "archive_path=$archivePath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.asset_base_name }}
          path: |
            ${{ steps.package.outputs.archive_path }}
            ${{ steps.package.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assetBaseName = '${{ steps.package.outputs.asset_base_name }}'
          $archivePath = '${{ steps.package.outputs.archive_path }}'
          $checksumPath = '${{ steps.package.outputs.checksum_path }}'
          $tagName = '${{ inputs.tag_name }}'
          $releaseName = '${{ inputs.release_name }}'
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'

          @"
          ## $releaseName

          ApeRadar 的 Windows x64 正式版本。

          ### 下载说明

          - 主程序：``$assetBaseName.zip``
          - SHA-256 校验文件：``$assetBaseName.sha256``
          - 系统架构：Windows x64
          - 发布方式：自包含（Self-contained）

          当前压缩包已经包含 .NET 桌面运行时，解压后可直接运行 ``ApeRadar.exe``，**无需另外安装 .NET**。包内文件较多、体积较大，是因为包含了完整的 .NET、WPF/WinForms 运行组件以及图形库原生依赖，并非重复文件。

          如果系统提示缺少或需要修复 .NET，请从微软官方下载 **.NET 10 Desktop Runtime x64**：

          https://dotnet.microsoft.com/zh-cn/download/dotnet/10.0/runtime

          > 下载页面中请选择“.NET 桌面运行时”下的 Windows x64 安装程序，不要选择 ASP.NET Core Runtime。

          ### 使用方法

          1. 下载并完整解压 ``$assetBaseName.zip``。
          2. 运行目录中的 ``ApeRadar.exe``。
          3. 请勿只复制 EXE；当前自包含版本需要保留压缩包内的其他 DLL、配置和资源文件。
          "@ | Set-Content -Path $notesPath -Encoding utf8

          gh release view $tagName --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tagName $archivePath $checksumPath --clobber --repo '${{ github.repository }}'
            gh release edit $tagName --title $releaseName --notes-file $notesPath --latest --repo '${{ github.repository }}'
          }
          else {
            $arguments = @(
              'release', 'create', $tagName,
              '--repo', '${{ github.repository }}',
              '--target', '${{ github.sha }}',
              '--title', $releaseName,
              '--notes-file', $notesPath,
              '--latest',
              $archivePath,
              $checksumPath
            )
            if ('${{ inputs.prerelease }}' -eq 'true') {
              $arguments += '--prerelease'
            }
            gh @arguments
          }
